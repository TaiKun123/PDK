<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P.D.K CONSULT | 智能理療師</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- 1. 強制鎖死底層 --- */
        html, body {
            overflow: hidden !important; 
            height: 100% !important; 
            width: 100%;
            position: fixed;
            top: 0; left: 0;
            background-color: transparent;
            margin: 0; padding: 0;
        }

        /* --- 2. 聊天室主容器 --- */
        .chat-container {
            position: fixed;
            top: 80px; 
            bottom: 0; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        /* --- 3. 聊天訊息區 --- */
        .chat-box {
            flex: 1; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            padding: 20px 20px 30px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* --- 4. 底部輸入區 (修改：圓角弧度與陰影) --- */
        .chat-input-wrapper {
            flex-shrink: 0; 
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); 
            background: rgba(10, 10, 10, 0.95);
            /* 拿掉生硬的邊線，改成柔和的頂部圓角與陰影 */
            border-top: none; 
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            width: 100%;
        }

        .chat-input-pill {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px; 
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: border-color 0.3s;
        }
        .chat-input-pill:focus-within {
            border-color: rgba(255, 255, 255, 0.5); 
        }

        /* 輸入框元件統一對齊 */
        .img-upload-label {
            width: 36px; height: 36px; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #aaa; font-size: 1.2rem; 
            border-radius: 50%; transition: 0.3s; margin: 0;
            flex-shrink: 0;
        }
        .img-upload-label:hover { color: #fff; background: rgba(255,255,255,0.1); }
        #fileInput { display: none; }

        .chat-input {
            flex: 1; 
            height: 40px; 
            padding: 0 15px; 
            margin: 0;
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 1rem; 
            outline: none;
        }
        .chat-input::placeholder { color: #777; }

        .send-btn-icon {
            width: 36px; height: 36px; 
            background: #fff; color: #000; 
            border: none; border-radius: 50%; 
            cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-left: 5px;
        }
        .send-btn-icon i {
            margin-left: -2px; 
            margin-top: 2px;
            font-size: 1rem;
        }
        .send-btn-icon:hover { background: #ccc; transform: scale(1.05); }
        .send-btn-icon:active { transform: scale(0.95); }

        /* --- 訊息氣泡樣式 --- */
        .msg-row { display: flex; width: 100%; }
        .msg-row.ai { justify-content: flex-start; }
        .msg-row.user { justify-content: flex-end; }

        .msg-bubble {
            max-width: 85%; padding: 15px 18px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; word-wrap: break-word; color: #ccc;
        }
        .msg-row.ai .msg-bubble {
            background: rgba(255,255,255,0.1); border-top-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .msg-row.user .msg-bubble {
            background: #fff; color: #000; border-top-right-radius: 4px;
        }
        .msg-image-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 8px; display: block; object-fit: cover; }

        /* --- 正在輸入中的動畫 --- */
        .typing-indicator { display: none; color: #aaa; font-size: 0.9rem; padding-left: 20px; margin-bottom: 10px; }
        .typing-indicator span { animation: blink 1.4s infinite both; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }

        /* --- 準備發送的圖片預覽 --- */
        #previewContainer {
            display: none; padding: 10px 20px; background: rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .preview-wrapper { position: relative; display: inline-block; }
        #imagePreview { max-height: 80px; border-radius: 8px; border: 1px solid #555; }
        .remove-img-btn { position: absolute; top: -8px; right: -8px; background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #fff; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px;}

        /* --- 動態生成的商品卡片 UI --- */
        .ai-recommendations { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 18px; }
        
        .ai-product-card {
            display: flex; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; 
            padding: 12px; 
            margin-bottom: 15px; 
            align-items: stretch; 
            transition: background 0.3s, transform 0.2s;
            cursor: pointer;
        }
        .ai-product-card:active { transform: scale(0.98); }
        
        /* 左側圖片區塊 */
        .ai-product-img-box {
            width: 80px; 
            flex-shrink: 0;
            margin-right: 15px;
            display: flex;
            align-items: center;
        }
        .ai-product-img { 
            width: 100%; 
            aspect-ratio: 4/5; 
            background-size: cover; 
            background-position: center; 
            border-radius: 6px; 
            background-color: #222; 
        }

        /* 右側資訊與按鈕區塊 (修改：改為垂直置中，縮小間距) */
        .ai-product-content { 
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center; /* ★ 關鍵修改：讓內容垂直置中，不再上下撐開 */
            gap: 10px; /* ★ 關鍵修改：名稱和價錢按鈕保持 10px 的舒服間距 */
        }
        
        .ai-product-name { 
            color: #fff; 
            font-weight: bold; 
            font-size: 1.05rem; 
            line-height: 1.3;
            letter-spacing: 1px; 
        }

        .ai-product-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center; /* 讓價錢和購物車按鈕對齊 */
        }

        .ai-product-price { 
            color: #ccc; 
            font-family: 'Times New Roman', serif; 
            font-size: 1.1rem; 
        }

        /* 圓形購物車 Icon 按鈕 */
        .ai-cart-btn-icon {
            background: rgba(255,255,255,0.1); 
            color: #fff; 
            border: 1px solid rgba(255,255,255,0.3);
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            transition: all 0.3s;
        }
        .ai-cart-btn-icon svg {
            width: 16px; height: 16px; 
            fill: none; stroke: currentColor; stroke-width: 1.5;
        }
        .ai-cart-btn-icon:hover, .ai-product-card:hover .ai-cart-btn-icon { 
            background: #fff; 
            color: #000; 
            border-color: #fff;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="bg-fixed-layer"></div>
    
    <nav class="navbar">
        <div class="menu-toggle" onclick="openNav()">&#9776;</div>
        <a href="/" class="logo">P  D  K</a>
        <div class="cart-wrapper" onclick="toggleCart()">
            <svg class="cart-icon-svg" viewBox="0 0 24 24"><path d="M6 6h15l-1.68 9H6.96L4.2 3H1v3h2l3.6 15h12v-3H7.8L6 6z"/><circle cx="9" cy="20" r="1.5" fill="#fff"/><circle cx="17" cy="20" r="1.5" fill="#fff"/></svg>
            <span class="cart-badge">0</span>
        </div>
    </nav>

    {% include 'includes/sidebar.html' %}
    {% include 'includes/cart_drawer.html' %}

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="msg-row ai">
                <div class="msg-bubble">
                    <strong style="color:#fff; font-size:1.05rem;">歡迎來到 P.D.K 命定諮詢室。</strong><br><br>請記得「洗髮精照顧頭皮，保養品修護髮絲」。為了給您最精準的配方，請先告訴我：<br><br><strong style="color:#fff;">您的頭皮到了下午，通常是什麼狀況呢？</strong><br><span style="font-size:0.85rem; color:#999; margin-top:5px; display:block;">（例如：很容易出油、有頭皮屑、有點緊繃...等。也可以直接點擊下方相機，拍張頭皮或髮尾的照片傳給我喔！）</span>
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">輸入中 <span>.</span><span>.</span><span>.</span></div>

        <div id="previewContainer">
            <div class="preview-wrapper">
                <img id="imagePreview" src="">
                <button class="remove-img-btn" onclick="removeImage()"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <div class="chat-input-wrapper">
            <div class="chat-input-pill">
                <label class="img-upload-label" title="上傳照片">
                    <i class="fas fa-camera"></i>
                    <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
                </label>
                <input type="text" id="chatInput" class="chat-input" placeholder="輸入您的狀況..." autocomplete="off">
                <button class="send-btn-icon" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    {% include 'includes/quick_view_modal.html' ignore missing %}

    <script>
        const DB_PRODUCTS = {{ products_json | safe if products_json else '{}' }};
        
        let chatHistory = [];
        let currentBase64Image = null;
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const typingIndicator = document.getElementById('typingIndicator');

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        chatInput.addEventListener('focus', function() {
            setTimeout(scrollToBottom, 100);
        });

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Image = e.target.result;
                    document.getElementById('imagePreview').src = currentBase64Image;
                    document.getElementById('previewContainer').style.display = 'block';
                    chatInput.focus();
                    scrollToBottom();
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentBase64Image = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewContainer').style.display = 'none';
        }

        function parseAndRenderAI(text) {
            let cleanText = text;
            let productIds = [];
            let chartData = null;

            // 1. 抓取推薦商品暗號 (這段剛剛被你不小心蓋掉了，我幫你補回來)
            const regexRecommend = /\[RECOMMEND:\s*([^\]]+)\]/g;
            let matchRecommend;
            while ((matchRecommend = regexRecommend.exec(cleanText)) !== null) {
                let ids = matchRecommend[1].split(',').map(id => id.trim());
                productIds.push(...ids);
                cleanText = cleanText.replace(matchRecommend[0], ''); 
            }

            // 2. 抓取雷達圖分數暗號 (使用防呆，確保只抓數字)
            const regexChart = /\[CHART_SCORE:\s*([^\]]+)\]/g;
            let matchChart;
            while ((matchChart = regexChart.exec(cleanText)) !== null) {
                chartData = matchChart[1].match(/\d+/g).map(Number);
                cleanText = cleanText.replace(matchChart[0], ''); 
            }

            // 3. 處理 Markdown 排版
            let htmlContent = cleanText
                .replace(/###\s*([^\n]+)/g, '<div style="font-size: 1.1rem; color: #fff; font-weight: bold; margin: 15px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">$1</div>')
                .replace(/\*\*(.*?)\*\*/g, '<strong style="color: #fff; letter-spacing: 0.5px;">$1</strong>')
                .replace(/\n/g, '<br>');
            htmlContent = htmlContent.replace(/(<br>\s*){3,}/g, '<br><br>');

            // 4. 如果有圖表資料，建立畫布容器 (稍後再畫)
            if (chartData && chartData.length === 5) {
                // 產生一個隨機 ID 避免多個圖表衝突
                let chartId = 'radar_' + Math.random().toString(36).substr(2, 9);
                htmlContent += `
                    <div style="width: 100%; max-width: 280px; margin: 20px auto; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px;">
                        <canvas id="${chartId}"></canvas>
                    </div>
                `;
                // 延遲 100 毫秒，等 DOM 渲染完畢後呼叫畫圖函數
                setTimeout(() => renderRadarChart(chartId, chartData), 100);
            }

            // 5. 渲染商品卡片
            if (productIds.length > 0) {
                htmlContent += `<div class="ai-recommendations">`;
                productIds.forEach(id => {
                    const product = DB_PRODUCTS[id];
                    if (product) {
                        let fullDesc = product.description || '';
                        let quickViewDesc = fullDesc.includes('======') ? (fullDesc.split('======').length > 1 ? fullDesc.split('======')[1] : fullDesc.split('======')[0]) : fullDesc;
                        let safeDesc = quickViewDesc.replace(/\n/g, '').replace(/\r/g, '').replace(/'/g, "\\'");
                        let safeImg = product.image ? product.image : '';

                        htmlContent += `
                        <div class="ai-product-card" onclick="openQuickView('${id}', '${product.name}', ${product.price}, '${safeDesc}', '${safeImg}')">
                            <div class="ai-product-img-box"><div class="ai-product-img" style="${safeImg ? `background-image: url('${safeImg}');` : ''}"></div></div>
                            <div class="ai-product-content">
                                <div class="ai-product-name">${product.name}</div>
                                <div class="ai-product-bottom-row">
                                    <div class="ai-product-price">NT$ ${product.price}</div>
                                    <div class="ai-cart-btn-icon">
                                        <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.68 9H6.96L4.2 3H1v3h2l3.6 15h12v-3H7.8L6 6z"/><circle cx="9" cy="20" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.5" fill="currentColor" stroke="none"/></svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                htmlContent += `</div>`;
            }
            return htmlContent;
        }
        function appendMessage(sender, text, imgBase64 = null) {
            const msgRow = document.createElement('div');
            msgRow.className = `msg-row ${sender}`;
            
            let finalHtml = '';
            if (sender === 'ai') {
                finalHtml = parseAndRenderAI(text);
            } else {
                finalHtml = text.replace(/\n/g, '<br>');
                if (imgBase64) {
                    finalHtml += `<img src="${imgBase64}" class="msg-image-preview">`;
                }
            }

            msgRow.innerHTML = `<div class="msg-bubble">${finalHtml}</div>`;
            chatBox.appendChild(msgRow);
            
            setTimeout(scrollToBottom, 50);
            
            chatHistory.push({ sender: sender, text: text });
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            const img = currentBase64Image;
            
            if (!text && !img) return;

            appendMessage('user', text, img);
            
            chatInput.value = '';
            removeImage();

            typingIndicator.style.display = 'block';
            scrollToBottom();

            try {
                const response = await fetch('/api/ai_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        image: img,
                        history: chatHistory.slice(-6) 
                    })
                });

                const result = await response.json();
                typingIndicator.style.display = 'none';

                if (result.success) {
                    appendMessage('ai', result.reply);
                } else {
                    appendMessage('ai', '⚠️ ' + result.message);
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('ai', '⚠️ 網路連線異常，請稍後再試一次。');
            }
        }

        // 負責把雷達圖畫出來的函數
        function renderRadarChart(canvasId, dataScores) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['頭皮清爽度', '頭皮防禦力', '柔順光澤度', '環境抗禦力', '髮絲強韌度'],
                    datasets: [{
                        label: '您的 P.D.K 髮況健康指數',
                        data: dataScores,
                        backgroundColor: 'rgba(255, 255, 255, 0.2)', // 充滿質感的半透明白
                        borderColor: 'rgba(255, 255, 255, 0.8)',
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#fff',
                        borderWidth: 1.5,
                        pointRadius: 2
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: {
                                color: '#ccc',
                                font: { size: 11, family: 'Playfair Display, sans-serif' }
                            },
                            ticks: { display: false, min: 0, max: 100 } // 隱藏死板的分數刻度
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#fff', font: { size: 12 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
