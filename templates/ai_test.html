<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智能理療師 | P.D.K</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container {
            max-width: 600px; margin: 80px auto 30px; 
            height: calc(100vh - 120px);
            display: flex; flex-direction: column;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; position: relative; z-index: 10;
        }

        .chat-header {
            padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chat-title {
            font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #fff; letter-spacing: 3px; margin: 0;
        }
        .chat-subtitle { font-size: 0.8rem; color: #aaa; letter-spacing: 1px; margin-top: 5px; }

        .chat-box {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
        }

        .msg-row { display: flex; width: 100%; }
        .msg-row.ai { justify-content: flex-start; }
        .msg-row.user { justify-content: flex-end; }

        .msg-bubble {
            max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.6; font-size: 0.95rem; word-wrap: break-word;
        }
        .msg-row.ai .msg-bubble {
            background: rgba(255,255,255,0.1); color: #fff; border-top-left-radius: 0;
        }
        .msg-row.user .msg-bubble {
            background: #fff; color: #000; border-top-right-radius: 0;
        }
        .msg-image-preview { max-width: 100%; border-radius: 4px; margin-top: 8px; display: block; }

        .chat-input-area {
            padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: flex-end; gap: 10px; background: rgba(0,0,0,0.3);
        }

        .img-upload-label {
            cursor: pointer; color: #fff; font-size: 1.2rem; padding: 10px; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .img-upload-label:hover { color: #aaa; }
        #fileInput { display: none; }

        .chat-input {
            flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 12px 15px; border-radius: 4px; font-size: 1rem; resize: none; overflow: hidden; min-height: 45px; max-height: 120px; outline: none;
        }
        .chat-input:focus { border-color: #fff; }

        .send-btn {
            background: #fff; color: #000; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 1px;
        }
        .send-btn:hover { background: #ccc; }

        /* 正在輸入中的動畫 */
        .typing-indicator { display: none; color: #aaa; font-size: 0.9rem; padding-left: 10px; margin-bottom: 10px; }
        .typing-indicator span { animation: blink 1.4s infinite both; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
        
        #previewContainer { display: none; margin-bottom: 10px; position: relative; width: fit-content; }
        #imagePreview { max-height: 100px; border-radius: 4px; border: 1px solid #fff; }
        .remove-img-btn { position: absolute; top: -8px; right: -8px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="bg-fixed-layer"></div>
    <nav class="navbar">
        <a href="/" class="logo">P  D  K</a>
    </nav>

    <div class="chat-container">
        <div class="chat-header">
            <h1 class="chat-title">P.D.K CONSULT</h1>
            <div class="chat-subtitle">資深 AI 理療師在線為您診斷</div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg-row ai">
                <div class="msg-bubble">
                    哈囉！我是 P.D.K 的線上理療師。<br>想要擁有好髮質，得從了解頭皮開始。<br>平常到了下午，你的頭皮通常是什麼狀況呢？（例如：很容易出油、有頭皮屑、有點緊繃...等），如果不知道怎麼形容，也可以直接拍張頭皮或髮尾的照片傳給我喔！
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">設計師正在輸入中 <span>.</span><span>.</span><span>.</span></div>

        <div style="padding: 0 15px;">
            <div id="previewContainer">
                <img id="imagePreview" src="">
                <button class="remove-img-btn" onclick="removeImage()"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <div class="chat-input-area">
            <label class="img-upload-label" title="上傳髮況照片">
                <i class="fas fa-camera"></i>
                <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
            </label>
            <textarea id="chatInput" class="chat-input" placeholder="輸入您的狀況..." rows="1"></textarea>
            <button class="send-btn" onclick="sendMessage()">發送</button>
        </div>
    </div>

    <script>
        let chatHistory = [];
        let currentBase64Image = null;
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const typingIndicator = document.getElementById('typingIndicator');

        // 自動調整輸入框高度
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // 支援 Enter 鍵發送 (Shift+Enter 換行)
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Image = e.target.result;
                    document.getElementById('imagePreview').src = currentBase64Image;
                    document.getElementById('previewContainer').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentBase64Image = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewContainer').style.display = 'none';
        }

        function appendMessage(sender, text, imgBase64 = null) {
            const msgRow = document.createElement('div');
            msgRow.className = `msg-row ${sender}`;
            
            let contentHtml = text.replace(/\n/g, '<br>');
            if (imgBase64) {
                contentHtml += `<img src="${imgBase64}" class="msg-image-preview">`;
            }

            msgRow.innerHTML = `<div class="msg-bubble">${contentHtml}</div>`;
            chatBox.appendChild(msgRow);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // 存入歷史紀錄 (只存純文字，不存圖片 Base64 避免佔用太大記憶體)
            chatHistory.push({ sender: sender, text: text });
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            const img = currentBase64Image;
            
            if (!text && !img) return;

            // 1. 顯示客人的訊息
            appendMessage('user', text, img);
            
            // 2. 清空輸入框與圖片
            chatInput.value = '';
            chatInput.style.height = 'auto';
            removeImage();

            // 3. 顯示 AI 正在思考
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 4. 打 API 給後端
            try {
                const response = await fetch('/api/ai_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        image: img,
                        history: chatHistory.slice(-6) // 只傳最近6句話，避免 token 爆掉
                    })
                });

                const result = await response.json();
                typingIndicator.style.display = 'none';

                if (result.success) {
                    appendMessage('ai', result.reply);
                } else {
                    appendMessage('ai', '⚠️ ' + result.message);
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('ai', '⚠️ 網路連線異常，請重新整理後再試一次。');
            }
        }
    </script>
</body>
</html>
