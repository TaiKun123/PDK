<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重設密碼 | P.D.K</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="bg-fixed-layer"></div>
    
    <nav class="navbar">
        <div class="menu-toggle" onclick="openNav()">&#9776;</div>
        <a href="/" class="logo">P  D  K</a>
        <div style="width: 30px;"></div>
    </nav>

    {% include 'includes/sidebar.html' %}

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Reset Password</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert-box error">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}

            <form action="/reset_password" method="POST">
                <div class="auth-form-group">
                    <label class="auth-label">驗證碼 Verification Code</label>
                    <input type="text" name="code" class="auth-input" placeholder="請輸入信箱中的 6 位數代碼" required>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label">新密碼 New Password</label>
                    <input type="password" name="password" class="auth-input" placeholder="至少 6 位數" required>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label">確認密碼 Confirm Password</label>
                    <input type="password" name="confirm_password" class="auth-input" placeholder="再次輸入密碼" required>
                </div>

                <button type="submit" class="btn-auth-submit">重設密碼 RESET</button>
            </form>
        </div>
    </div>

    <script>
        function openNav() {
            var sidenav = document.getElementById("mySidenav");
            if(sidenav) sidenav.style.width = "280px"; 
            var overlay = document.getElementById("menuOverlay");
            if(overlay) overlay.classList.add("show");
        }
    </script>
</body>
</html>
