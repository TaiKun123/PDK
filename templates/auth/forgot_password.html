<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>忘記密碼 | P.D.K</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="bg-fixed-layer"></div>
    
    <nav class="navbar">
        <div class="menu-toggle" onclick="openNav()">&#9776;</div>
        <a href="/" class="logo">P  D  K</a>
        <div style="width: 30px;"></div>
    </nav>

    {% include 'includes/sidebar.html' %}

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Forgot Password</h2>
            <p style="color: #aaa; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.5;">
                請輸入您註冊時的電子信箱，<br>我們將寄送驗證碼給您。
            </p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert-box error">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}

            <form action="/forgot_password" method="POST">
                <div class="auth-form-group">
                    <label class="auth-label">電子信箱 Email</label>
                    <input type="email" name="email" class="auth-input" placeholder="example@email.com" required>
                </div>
                <button type="submit" class="btn-auth-submit">發送驗證碼 SEND CODE</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('login') }}">
                    <i class="fas fa-arrow-left"></i> 返回登入 Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        function openNav() {
            var sidenav = document.getElementById("mySidenav");
            if(sidenav) sidenav.style.width = "280px"; 
            var overlay = document.getElementById("menuOverlay");
            if(overlay) overlay.classList.add("show");
        }
    </script>
</body>
</html>
