<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>後台管理登入 | P.D.K Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* 讓後台登入背景深一點，區隔一下 */
        body { background-color: #000; } 
        .admin-badge { 
            background: #d4af37; color: #000; padding: 5px 10px; 
            border-radius: 4px; font-size: 0.8rem; font-weight: bold;
            display: inline-block; margin-bottom: 15px;
        }
    </style>
</head>
<body>
    
    <div class="auth-container">
        <div class="auth-card" style="border: 1px solid #333; max-width: 400px;">
            <div style="text-align: center;">
                <span class="admin-badge">ADMIN PORTAL</span>
            </div>
            <h2 class="auth-title">P.D.K 後台管理</h2>
            
            {% if error %}
                <div class="alert-box" style="background: #5c2b2b; color: #fff;">{{ error }}</div>
            {% endif %}

            <form action="{{ url_for('admin_login') }}" method="POST">
                <div class="auth-form-group">
                    <label class="auth-label">管理員信箱</label>
                    <input type="email" name="email" class="auth-input" placeholder="admin@pdk.com" required>
                </div>
                <div class="auth-form-group">
                    <label class="auth-label">管理密碼</label>
                    <input type="password" name="password" class="auth-input" required>
                </div>

                <button type="submit" class="btn-auth-submit" style="background: #333; border: 1px solid #555;">
                    進入後台 ENTER
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="{{ url_for('home') }}" style="color: #666; font-size: 0.8rem;">返回前台首頁</a>
            </div>
        </div>
    </div>
</body>
</html>
